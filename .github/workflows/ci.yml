name: CI
on:
  push:
  pull_request_target:
    types:
      - opened

jobs:
  sdk-ci:
    name: "SDK CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: CI
        run: make ci
